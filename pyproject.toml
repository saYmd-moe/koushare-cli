[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "koushare-cli"
version = "0.5.0"
description = "A small CLI for inspecting and downloading Koushare videos and live replays you can access."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "saYmd-moe"}]
dependencies = [
  "platformdirs>=4.0",
  "requests>=2.31",
]
keywords = ["koushare", "hls", "m3u8", "cli", "video"]

classifiers = [
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Video",
]

[project.optional-dependencies]
dev = ["build>=1.2", "pytest>=8", "twine>=5"]

[project.scripts]
ksdl = "koushare_cli.cli:main"

[project.urls]
Homepage = "https://github.com/saYmd-moe/koushare-cli"
Issues = "https://github.com/saYmd-moe/koushare-cli/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
